name: R CMD check

on:
  push:
    branches: [master, 'v1.6-rebase']
    paths:
      - 'R-package/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/r-check.yml'
  pull_request:
    branches: [master]
    paths:
      - 'R-package/**'
      - 'src/**'
      - 'include/**'
      - '.github/workflows/r-check.yml'
  workflow_dispatch:

jobs:
  r-check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package
          extra-packages: |
            any::rcmdcheck
            any::MASS
            any::Matrix

      - uses: r-lib/actions/setup-tinytex@v2

      - name: Build and check
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: R-package
          args: 'c("--as-cran", "--no-manual")'
          build_args: '"--no-build-vignettes"'
          error-on: '"error"'
          check-dir: '"check"'
