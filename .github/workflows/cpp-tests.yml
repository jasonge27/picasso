name: C++ build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpp-tests:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-ci
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build-ci --parallel 2
      - name: Check source mirrors
        run: cmake --build build-ci --target check_mirrors
      - name: Test
        run: ctest --test-dir build-ci --output-on-failure
      - name: Verify the complete C ABI
        run: python3 tests/verify_c_api_exports.py build-ci/libpicasso.so

  sanitizers:
    name: Linux Clang ASan and UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON
          -DPICASSO_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel 2
      - name: Test under sanitizers
        run: ctest --test-dir build-sanitize --output-on-failure

  windows-c-api:
    name: Windows x64 C ABI exports
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure shared library
        run: >-
          cmake -S . -B build-windows -A x64
          -DBUILD_TESTING=OFF
          -DPICASSO_STAGE_DIRECTORY=${{ github.workspace }}/build-windows/stage
      - name: Build and stage DLL
        run: >-
          cmake --build build-windows --config Release
          --target stage_picasso --parallel 2
      - name: Verify the complete C ABI and runtime calling convention
        run: >-
          python tests/verify_c_api_exports.py
          build-windows/stage/picasso.dll

  python-wrapper:
    name: Python wrapper and source bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python test dependencies
        run: python -m pip install numpy scipy wheel
      - name: Build native library
        run: make dylib
      - name: Install library into source package
        run: |
          mkdir -p python-package/pycasso/lib
          cp lib/libpicasso.so python-package/pycasso/lib/libpicasso.so
      - name: Test Python wrapper
        run: python python-package/test_pycasso.py
      - name: Test Python native-library and benchmark isolation
        env:
          PICASSO_NATIVE_LIBRARY: ${{ github.workspace }}/lib/libpicasso.so
        run: python python-package/test_reproducibility.py
      - name: Assemble standalone source bundle
        run: |
          cp lib/libpicasso.so /tmp/picasso-stale-native.so
          make pippack
          test -f picasso-python/pycasso/src/include/eigen3/Eigen/Dense
      - name: Failed native build cannot reuse a stale library
        run: |
          cp /tmp/picasso-stale-native.so \
            picasso-python/pycasso/lib/libpicasso.so
          if (cd picasso-python && CXX=false python setup.py --name); then
            echo "setup.py unexpectedly ignored the native build failure"
            exit 1
          fi
          test ! -e picasso-python/pycasso/lib/libpicasso.so
          test ! -e picasso-python/pycasso/lib/libpicasso.dylib
          test ! -e picasso-python/pycasso/lib/picasso.dll
      - name: Build a binary-free source distribution
        run: |
          cd picasso-python
          python setup.py sdist --dist-dir dist-clean
          cd ..
          python - <<'PY'
          import glob
          import tarfile

          archives = glob.glob('picasso-python/dist-clean/pycasso-*.tar.gz')
          assert len(archives) == 1, archives
          with tarfile.open(archives[0], 'r:gz') as archive:
              names = archive.getnames()
          forbidden = [
              name for name in names
              if name.endswith((
                  '.so', '.dylib', '.dll', '.o', '.d', '.a', '.DS_Store',
              )) or '/build/' in name
          ]
          assert not forbidden, forbidden
          assert any(name.endswith('Eigen/Dense') for name in names)
          PY
      - name: Build and inspect the platform wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation \
            picasso-python/dist-clean/pycasso-*.tar.gz \
            --wheel-dir wheelhouse
          python - <<'PY'
          import glob
          import os
          import zipfile

          wheels = glob.glob('wheelhouse/pycasso-*.whl')
          assert len(wheels) == 1, wheels
          assert not os.path.basename(wheels[0]).endswith('-none-any.whl')
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          native = [
              name for name in names
              if name.startswith('pycasso/lib/') and
              name.endswith(('.so', '.dylib', '.dll'))
          ]
          assert len(native) == 1, native
          assert not any(name.startswith('pycasso/src/') for name in names)
          PY
      - name: Install wheel in a clean environment and run multinomial smoke
        run: |
          python -m venv --system-site-packages /tmp/picasso-wheel-venv
          /tmp/picasso-wheel-venv/bin/python -m pip install \
            --force-reinstall --no-deps wheelhouse/pycasso-*.whl
          /tmp/picasso-wheel-venv/bin/python - <<'PY'
          import numpy as np
          import pycasso
          from pycasso import Solver
          from pycasso.libpath import find_lib_path

          assert '/tmp/picasso-wheel-venv/' in pycasso.__file__, pycasso.__file__
          libraries = find_lib_path()
          assert len(libraries) == 1, libraries
          assert '/tmp/picasso-wheel-venv/' in libraries[0], libraries

          import subprocess
          import sys
          subprocess.run(
              [sys.executable, 'tests/verify_c_api_exports.py', libraries[0]],
              check=True)

          x = np.array([
              [-2.0, 0.0], [-1.5, 0.2],
              [0.0, -2.0], [0.2, -1.5],
              [2.0, 2.0], [1.5, 1.8],
          ])
          y = np.array([0, 0, 1, 1, 2, 2])
          model = Solver(
              x, y, lambdas=[0.1], family='multinomial',
              prec=1e-4, max_ite=300, verbose=False)
          model.train()
          assert model.result['status'] == 'completed', model.result['status']
          assert model.result['beta'].shape == (1, 3, 2)
          probabilities = model.predict(x, type='response')
          assert np.allclose(probabilities.sum(axis=1), 1.0)
          PY

  r-wrapper:
    name: R wrapper and registered native API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R-package
          extra-packages: any::testthat
      - name: Install R package from a clean native build
        run: R CMD INSTALL --preclean R-package
      - name: Run R wrapper tests
        run: >-
          Rscript -e
          'library(picasso); testthat::test_dir("R-package/tests/testthat",
          reporter="summary", stop_on_failure=TRUE)'
      - name: Build R source package
        run: R CMD build R-package --no-build-vignettes
      - name: Check R source package
        run: R CMD check --no-manual --no-build-vignettes picasso_*.tar.gz
